name: Deploy Redirect to GitHub Pages

on:
  workflow_dispatch:
  # Disabled: bin/deploy.sh (called by bin/ephemeral.sh) uses `lstk aws`
  # throughout, which always targets its own locally-managed emulator and
  # ignores AWS_ENDPOINT_URL, so it can't reach the remote ephemeral instance
  # this workflow provisions. Re-enable once that's resolved.
  # schedule:
  #   - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Git Configuration
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Set up Python 3.11
        id: setup-python
        uses: actions/setup-python@v2
        with:
          python-version: 3.11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install AWS CLI
        run: |
          pip3 install awscli awscli-local

      - name: Run Ephemeral Script and Capture Output
        run: |
          # TODO(lstk): no ephemeral-instance equivalent in lstk yet — bin/ephemeral.sh still requires the `localstack` CLI.
          pip3 install localstack
          bash bin/ephemeral.sh 2>&1 | tee output.log

          OUTPUT=$(cat output.log)
          NEW_URL=$(echo "$OUTPUT" | grep -Eo 'https://ls-[^ ]+')
          
          if [ -z "$NEW_URL" ]; then
            echo "Error: Failed to extract URL from script output."
            exit 1
          fi

          NEW_URL="${NEW_URL}#"
          echo "Extracted URL: $NEW_URL"
          echo "NEW_URL=$NEW_URL" >> $GITHUB_ENV
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

      - name: Generate index.html with New Redirect URL
        run: |
          NEW_URL="${{ env.NEW_URL }}"
          
          # Validate the URL
          if [[ ! "$NEW_URL" =~ ^https?:// ]]; then
            echo "Error: Invalid URL provided."
            exit 1
          fi
          
          echo "Redirecting to: $NEW_URL"
          
          cat > index.html <<EOL
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta http-equiv="refresh" content="0; URL=${NEW_URL}">
              <title>Redirecting...</title>
          </head>
          <body>
              <p>If you are not redirected automatically, follow this <a href="${NEW_URL}">link</a>.</p>
          </body>
          </html>
          EOL
      - name: Switch to gh-pages Branch and Commit Changes
        run: |
          git fetch origin gh-pages || echo "gh-pages branch does not exist; creating it."
          git checkout gh-pages || git checkout --orphan gh-pages
          git rm -rf .  # Remove all files in the branch
          git add index.html
          git commit -m "Update redirect to ${NEW_URL}"
          git push origin gh-pages --force