name: Deploy using CDK

on:
  push:
    paths-ignore:
      - 'README.md'
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # “At 00:00 on Sunday.”
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  cdk:
    name: Setup infrastructure using CDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install CDK
        run: |
          npm install -g aws-cdk

      - name: Install lstk
        run: |
          npm install -g @localstack/lstk

      - name: Start LocalStack
        run: |
          lstk --non-interactive start --timeout 120s
          lstk cdk --version
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          LOCALSTACK_DEBUG: "1"

      - name: Configure AWS profile for lstk
        run: |
          # Without a profile, `lstk aws` prints "Note: No AWS profile found,
          # run 'lstk setup aws'" to stdout, which corrupts every $(lstk aws ...)
          # command substitution in bin/deploy.sh and bin/deploy_cdk.sh.
          lstk setup aws --non-interactive --force

      - name: Install dependencies
        run: |
          cd cdk 
          pip3 install -r requirements.txt
          cd ..
          cd frontend
          echo "REACT_APP_API_ENDPOINT=https://example.com" > .env.local
          npm i && npx react-scripts build

      - name: Deploy using CDK
        run: |
          cd cdk
          export AWS_ACCESS_KEY_ID="test"
          export AWS_SECRET_ACCESS_KEY="test"
          export AWS_DEFAULT_REGION="us-east-1"
          lstk cdk bootstrap
          cd ..
          AWS_CMD="lstk aws" CDK_CMD="lstk cdk" bash ./bin/deploy_cdk.sh

      - name: List the resources
        run: |
          lstk aws lambda list-functions
          lstk aws sqs list-queues
          lstk aws dynamodb list-tables
          lstk aws s3 ls

      - name: Set up test dependencies
        run: |
          pip3 install requests boto3 pytest localstack-sdk-python

      - name: Run Integration Tests
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: |
          pytest tests/test_infra.py

      - name: Send a Slack notification
        if: failure() || github.event_name != 'pull_request'
        uses: ravsamhq/notify-slack-action@v2
        with:
          status: ${{ job.status }}
          token: ${{ secrets.GITHUB_TOKEN }}
          notification_title: "{workflow} has {status_message}"
          message_format: "{emoji} *{workflow}* {status_message} in <{repo_url}|{repo}>"
          footer: "Linked Repo <{repo_url}|{repo}> | <{run_url}|View Workflow run>"
          notify_when: "failure"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Generate a Diagnostic Report
        if: failure()
        run: |
          curl -s localhost:4566/_localstack/diagnose | gzip -cf > diagnose.json.gz

      - name: Upload the Diagnostic Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose.json.gz
          path: ./diagnose.json.gz
